[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shroom-vision"
version = "0.1.0"
description = "Detection and classification of hallucination spans in image-conditioned VLM outputs (SHROOM-visions 2026)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "sckwokyboom" }]
keywords = ["hallucination-detection", "vision-language-models", "multimodal", "shroom", "evaluation"]

[tool.setuptools]
packages = ["shroom", "shroom.backends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
