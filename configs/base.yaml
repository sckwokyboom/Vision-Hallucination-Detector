# Backend: mock | hf | mlx
backend: hf
model_id: google/gemma-4-E4B-it
n_samples: 5          # self-consistency samples (need temperature > 0)
temperature: 0.7      # sampling temperature so the N samples vary
tau: 0.7              # per-char prob threshold for IoU spans (swept optimum on en dev)
max_pixels: 1048576   # 1024*1024 — resizing avoids Qwen2.5-VL degenerate output on huge images
dev_frac: 0.1
seed: 13
